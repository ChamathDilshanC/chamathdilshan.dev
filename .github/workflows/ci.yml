name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://chamathdilshan.com
      NEXT_PUBLIC_API_URL: https://api.chamathdilshan.com
      CACHE_REVALIDATE_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build
